# See security-headers.conf's own comment for why it's a shared include
# rather than add_header lines written directly in each location block —
# nginx's add_header doesn't inherit into a location that sets its own, so
# copy-pasted headers silently vanish from whichever location happens to
# declare a Cache-Control of its own (this bit the first version of this
# file: try_files internally redirects "/" to "location = /index.html",
# which has its own Cache-Control, so it never got any of the headers set
# at the server level).
#
# limit_req adds a second, independent layer of anti-spam/abuse protection
# in front of the app-level rate limiting already enforced by auth-service
# itself (see OtpRateLimiter) — this one throttles at the network level,
# before a flood of requests even reaches the static file server or the
# backend.
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=web_limit burst=20 nodelay;

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's default) are safe to cache forever — a
    # content change always gets a new filename.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
