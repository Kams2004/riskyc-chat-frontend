<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff1a5e'/%3E%3Ctext x='12' y='17' font-family='serif' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ERC%3C/text%3E%3C/svg%3E"
    />
    <meta name="description" content="RiskyC Chat — sign in and chat from your browser." />
    <meta name="robots" content="noindex" />
    <!--
      Content-Security-Policy as a meta tag is defense-in-depth only — the
      real enforcement belongs in nginx's response headers (see
      web/security-headers.conf), since a meta CSP can't set frame-ancestors
      or report-uri and only applies after the HTML itself has already
      parsed. Keep the two in sync — they've drifted from each other once
      already.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' wss://chat.riskycfashion.com http://localhost:8091 http://localhost:8092 ws://localhost:8092 http://localhost:8083 http://localhost:8084 http://localhost:9010 http://167.86.120.214:8091 http://167.86.120.214:8092 ws://167.86.120.214:8092 http://167.86.120.214:8083 http://167.86.120.214:8084 http://167.86.120.214:9010; img-src 'self' data: http://localhost:9010 http://167.86.120.214:9010; script-src 'self'; base-uri 'none'; form-action 'self'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <title>RiskyC Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
