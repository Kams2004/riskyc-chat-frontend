# Included (not written inline) in every location block below that also
# sets its own Cache-Control — nginx's add_header does NOT inherit from a
# parent block into a location that declares any add_header of its own, so
# copy-pasting these by hand into each block is how they silently vanish
# from some responses. One include, reused everywhere, can't drift.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
# 'self' covers same-origin https:// fetches to chat.riskycfashion.com's
# proxied /auth /messaging /media /presence paths automatically, but NOT
# the WebSocket — connect-src checks scheme+host+port separately for ws/wss,
# so it needs its own explicit entry even though it's the same host.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' wss://chat.riskycfashion.com http://167.86.120.214:8091 http://167.86.120.214:8092 ws://167.86.120.214:8092 http://167.86.120.214:8083 http://167.86.120.214:8084 http://167.86.120.214:8095 ws://167.86.120.214:8095 http://167.86.120.214:9010; img-src 'self' data: http://167.86.120.214:9010; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
