# Included (not written inline) in every location block below that also
# sets its own Cache-Control — nginx's add_header does NOT inherit from a
# parent block into a location that declares any add_header of its own, so
# copy-pasting these by hand into each block is how they silently vanish
# from some responses. One include, reused everywhere, can't drift.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' http://167.86.120.214:8091; img-src 'self' data:; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
